{% extends "base.html" %}
{% block title %}Категория: {{ category }} — {{ site_name }}{% endblock %}
{% block content %}
<section class="wiki-page">
  <header class="page-head">
    <h1 class="page-title">Категория: {{ category }}</h1>
  </header>
  {% if not pages %}
  <p class="empty">В этой категории пока пусто.</p>
  {% else %}
  <ul class="page-list">
    {% for p in pages %}
    <li><a href="{{ p.url }}">{{ p.title }}</a></li>
    {% endfor %}
  </ul>
  {% endif %}
</section>
{% endblock %}
